name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check lua plugin spec

  lint:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.32.0
          args: lua plugin spec

  typecheck:
    name: lua-language-server
    runs-on: ubuntu-latest
    env:
      LUALS_VERSION: 3.19.2
    steps:
      - uses: actions/checkout@v4

      # LuaLS resolves the Neovim API from $VIMRUNTIME (see .luarc.json).
      - uses: ./.github/actions/setup-nvim

      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"

      - name: Type check
        run: make typecheck-lua

  test:
    name: busted (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-nvim
        with:
          version: ${{ matrix.nvim }}

      - uses: actions/cache@v4
        with:
          path: .rocks
          key: rocks-${{ runner.os }}-${{ hashFiles('Makefile', '*.rockspec') }}

      # Same entry point as local runs: hererocks bootstraps busted + nlua in .rocks/.
      - name: Run specs
        run: make test-lua
