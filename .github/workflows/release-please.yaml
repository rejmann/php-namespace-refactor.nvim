name: release-please

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates the release PR from the Conventional Commits on main;
      # merging that PR tags vX.Y.Z and publishes the GitHub release.
      # RELEASE_PAT is optional: with it, CI also runs on the release PR
      # (PRs opened with GITHUB_TOKEN don't trigger workflows).
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        timeout-minutes: 5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "Release created: ${{ steps.release.outputs.release_created }}"
          echo "Tag: ${{ steps.release.outputs.tag_name }}"
