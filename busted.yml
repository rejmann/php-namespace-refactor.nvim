    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  pending:
    args:
      - type: string
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  setup:
    args:
      - type: function
  teardown:
    args:
      - type: function
  assert:
    any: true
  spy:
    any: true
  stub:
    any: true
  mock:
    any: true
